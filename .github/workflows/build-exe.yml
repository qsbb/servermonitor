name: build-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install agent dependencies
        working-directory: agent
        # 需要 devDependencies：esbuild + pkg 是打包 exe 的工具
        run: npm ci

      - name: Check source and package versions match
        shell: pwsh
        run: |
          $source = (Select-String -Path agent/agent.mjs -Pattern 'AGENT_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $package = (Get-Content agent/package.json -Raw | ConvertFrom-Json).version
          if ($source -ne $package) { throw "version mismatch: agent.mjs=$source package.json=$package" }
          Write-Host "servermonitor agent version: $source"

      - name: Build Windows exe
        working-directory: agent
        run: node build-exe.mjs

      - name: Smoke test exe
        shell: pwsh
        run: |
          $exe = "dist/servermonitor-agent.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if ((Get-Item $exe).Length -lt 10MB) { throw "exe too small" }
          $output = & $exe --name ci-smoke --dry-run
          if ($LASTEXITCODE -ne 0) { throw "exe dry-run failed with $LASTEXITCODE" }
          $raw = $output -join "`n"
          if ($raw -match "undefined") { throw "dry-run output contains 'undefined'" }
          $snap = $raw | ConvertFrom-Json
          if (-not $snap.mem) { throw "missing mem block" }
          if (-not $snap.mem.total -or $snap.mem.total -le 0) { throw "invalid mem.total: $($snap.mem.total)" }
          if ($null -eq $snap.mem.available) { throw "mem.available is null on Windows" }
          if ($snap.mem.available -gt $snap.mem.total) { throw "mem.available $($snap.mem.available) exceeds total $($snap.mem.total)" }
          if (-not $snap.disks -or @($snap.disks).Count -lt 1) { throw "no disks collected" }
          if (-not $snap.net) { throw "missing net block" }
          Write-Host ("smoke ok: mem={0}G/{1}G available={2}G disks={3} iface={4}" -f $snap.mem.used, $snap.mem.total, $snap.mem.available, @($snap.disks).Count, $snap.net.iface)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: servermonitor-agent-windows
          path: dist/servermonitor-agent.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/servermonitor-agent.exe
