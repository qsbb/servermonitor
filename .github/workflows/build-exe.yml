name: build-windows-exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install agent dependencies
        working-directory: agent
        run: npm install --omit=dev

      - name: Build Windows exe
        working-directory: agent
        run: npx --yes pkg@5.8.1 . --targets node18-win-x64 --output ../dist/servermonitor-agent.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: servermonitor-agent-windows-exe
          path: dist/servermonitor-agent.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/servermonitor-agent.exe --title $tag --generate-notes
          } else {
            gh release upload $tag dist/servermonitor-agent.exe --clobber
          }
